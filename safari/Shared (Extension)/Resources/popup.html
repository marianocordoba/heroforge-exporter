<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 260px; margin: 0; padding: 16px;
      font: 13px/1.5 -apple-system, system-ui, sans-serif;
    }
    h1 { font-size: 14px; margin: 0 0 8px; }
    p { margin: 0 0 10px; opacity: .85; }
    a { color: #0a84ff; }
    .tag { display:inline-block; padding:2px 6px; border-radius:6px;
           background:#0a84ff22; color:#0a84ff; font-size:11px; }
  </style>
</head>
<body>
  <h1>HeroForge Exporter</h1>
  <p>Open a character on <a href="https://www.heroforge.com/" target="_blank">heroforge.com</a>. The export widget appears in the bottom-left corner of the page.</p>
  <p>Set a scale, optionally split the base, then export an <span class="tag">.stl</span> / <span class="tag">.zip</span>.</p>
</body>
</html>
